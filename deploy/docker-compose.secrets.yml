# Production secret override for Docker Compose.
#
#   mkdir -p deploy/secrets
#   openssl rand -hex 32 > deploy/secrets/muse2api_key
#   printf '%s' 'replace-with-a-strong-admin-password' > deploy/secrets/muse2api_admin_password
#   openssl rand -base64 32 > deploy/secrets/muse2api_credential_key
#   chmod 700 deploy/secrets && chmod 0444 deploy/secrets/*
#   docker compose -f docker-compose.yml -f deploy/docker-compose.secrets.yml up -d --build
#
# Compose file secrets are bind-mounted; the container runs as UID 10001 and
# must be able to read the file. Keep the directory 0700 but the files 0444.
# The *_FILE values win over ordinary environment variables, so secrets are
# not exposed in `docker inspect`.
services:
  muse2api:
    environment:
      MUSE2API_KEY: ""
      MUSE2API_ADMIN_PASSWORD: ""
      MUSE2API_CREDENTIAL_KEY: ""
      MUSE2API_KEY_FILE: /run/secrets/muse2api_key
      MUSE2API_ADMIN_PASSWORD_FILE: /run/secrets/muse2api_admin_password
      MUSE2API_CREDENTIAL_KEY_FILE: /run/secrets/muse2api_credential_key
    secrets:
      - muse2api_key
      - muse2api_admin_password
      - muse2api_credential_key

secrets:
  muse2api_key:
    file: ./secrets/muse2api_key
  muse2api_admin_password:
    file: ./secrets/muse2api_admin_password
  muse2api_credential_key:
    file: ./secrets/muse2api_credential_key
