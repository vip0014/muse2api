# HTTP reverse proxy example for Docker Compose.
# For public deployments terminate TLS here or at a load balancer; see
# nginx-tls.example.conf for a 443 server block.
#
# Backend: http://127.0.0.1:18610 (Compose binds 127.0.0.1 by default).
# Set MUSE2API_TRUST_PROXY=1 only when this proxy is the direct peer.

server {
    listen 80;
    server_name api.example.com;
    server_tokens off;
    client_max_body_size 16m;

    proxy_http_version 1.1;
    # Keep the port when present so Origin/CSRF comparison matches r.Host.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace, do not append a client-supplied header. The app takes the first
    # X-Forwarded-For value when trusted proxy mode is enabled.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    # Required for SSE (Chat/Responses) and useful for long media reads.
    proxy_buffering off;
    proxy_cache off;

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:18610;
    }

    location / {
        proxy_pass http://127.0.0.1:18610;
    }
}
