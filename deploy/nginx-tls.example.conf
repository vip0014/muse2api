# Public HTTPS reverse proxy example. Replace the server name and certificate
# paths, then run `nginx -t` before reload.
#
# The HTTP block only serves ACME challenges and redirects everything else.
# If TLS is terminated by a cloud load balancer, use nginx.example.conf there
# and forward X-Forwarded-Proto.

server {
    listen 80;
    server_name api.example.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # Requires nginx 1.25.1+. On older versions use:
    # listen 443 ssl http2;
    http2 on;
    server_name api.example.com;
    server_tokens off;
    client_max_body_size 64m;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    # Preserve a non-default port for Origin/CSRF matching.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_buffering off;
    proxy_cache off;

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:18610;
    }

    location / {
        proxy_pass http://127.0.0.1:18610;
    }
}
